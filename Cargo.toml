[package]
name = "switchyard"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
mlua = { version = "0.12.2", features = ["lua54"] }
mlua-json = { version = "1.0.1", features = ["lua54"] }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["full", "sync"] }
toml = "1.1.7"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
